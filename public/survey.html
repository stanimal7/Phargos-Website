<html lang="en">
<head>

    /* ── Reset & Base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --forest:  #1C2B14;
      --accent:  #96C95B;
      --bg:      #F5F1EB;
      --card:    #FFFFFF;
      --text:    #2C2C2C;
      --muted:   #7A7A6E;
      --border:  #E2DDD6;
      --danger:  #C0392B;
      --radius:  14px;
      --shadow:  0 2px 12px rgba(0,0,0,0.08);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── Header ───────────────────────────────────────────── */
    .header {
      background: var(--forest);
      padding: 18px 24px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }

    .header-text {
      display: flex;
      flex-direction: column;
    }

    .header-brand {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .header-sub {
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      font-weight: 400;
      margin-top: 1px;
    }

    /* ── Progress bar ─────────────────────────────────────── */
    .progress-wrap {
      background: var(--forest);
      padding: 0 0 12px;
    }

    .progress-bar-bg {
      height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 2px;
      margin: 0 24px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.4s ease;
      width: 0%;
    }

    .progress-label {
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      margin-top: 6px;
      letter-spacing: 0.03em;
    }

    /* ── Main content ─────────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px 60px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    /* ── Question Card ────────────────────────────────────── */
    .question-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px 28px;
      width: 100%;
      animation: fadeUp 0.3s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .question-number {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    .question-text {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text);
      margin-bottom: 28px;
    }

    /* ── Multiple Choice ──────────────────────────────────── */
    .choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .choice-btn {
      display: block;
      width: 100%;
      padding: 16px 20px;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .choice-btn:hover, .choice-btn:focus {
      border-color: var(--accent);
      background: rgba(150, 201, 91, 0.08);
    }

    .choice-btn.selected {
      border-color: var(--accent);
      background: rgba(150, 201, 91, 0.15);
      color: var(--forest);
    }

    .choice-btn:active {
      transform: scale(0.98);
    }

    /* ── Scale 1-5 ────────────────────────────────────────── */
    .scale-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .scale-btns {
      display: flex;
      gap: 10px;
      justify-content: space-between;
    }

    .scale-btn {
      flex: 1;
      aspect-ratio: 1;
      min-height: 58px;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scale-btn:hover, .scale-btn:focus {
      border-color: var(--accent);
      background: rgba(150, 201, 91, 0.08);
    }

    .scale-btn.selected {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--forest);
    }

    .scale-btn:active {
      transform: scale(0.95);
    }

    .scale-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      padding: 0 4px;
    }

    /* ── Text inputs ──────────────────────────────────────── */
    .text-input, .textarea-input {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 16px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s ease;
      resize: vertical;
    }

    .text-input:focus, .textarea-input:focus {
      border-color: var(--accent);
    }

    .textarea-input {
      min-height: 120px;
    }

    /* ── Next button ──────────────────────────────────────── */
    .next-btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 17px 24px;
      background: var(--forest);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .next-btn:hover {
      background: #253a1b;
    }

    .next-btn:active {
      transform: scale(0.98);
    }

    .next-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ── Error ────────────────────────────────────────────── */
    .error-screen, .thank-you-screen, .loading-screen, .demo-screen {
      text-align: center;
      padding: 40px 20px;
      width: 100%;
    }

    .error-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .error-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--danger);
    }

    .error-body {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* ── Thank you screen ─────────────────────────────────── */
    .ty-icon {
      width: 72px;
      height: 72px;
      background: rgba(150, 201, 91, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .ty-icon svg {
      width: 36px;
      height: 36px;
    }

    .ty-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--forest);
      margin-bottom: 10px;
    }

    .ty-body {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.6;
      max-width: 340px;
      margin: 0 auto;
    }

    .ty-confirm {
      margin-top: 20px;
      padding: 12px 20px;
      background: rgba(150, 201, 91, 0.15);
      border-radius: 8px;
      font-size: 14px;
      color: var(--forest);
      font-weight: 500;
      display: inline-block;
    }

    /* ── Demo mode banner ─────────────────────────────────── */
    .demo-banner {
      background: #FFF3CD;
      border-bottom: 1px solid #FFEAA7;
      padding: 10px 16px;
      text-align: center;
      font-size: 13px;
      color: #856404;
      font-weight: 500;
    }

    .demo-banner a {
      color: #533f03;
      font-weight: 600;
    }

    /* ── Demo responses panel ─────────────────────────────── */
    .demo-responses {
      margin-top: 24px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      width: 100%;
      text-align: left;
    }

    .demo-responses h3 {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .demo-response-item {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .demo-response-item:last-child {
      border-bottom: none;
    }

    .demo-q {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .demo-a {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    /* ── Loading ──────────────────────────────────────────── */
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

        id: 'b4',
        type: 'scale',
        text: 'How well do you feel set up to succeed in your role?',
        labels: ['Not well', 'Very well'],
      },
      {
        id: 'b5',
        type: 'long_text',
        text: 'Anything else on your mind?',
      },
    ],
  },

};

// ══════════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════════

let state = {
  person: null,
  survey: null,
  currentIndex: -1,   // -1 = intro screen
  answers: {},        // { questionId: answerValue }
  phase: 'loading',   // loading | intro | question | submitting | done | error
};

// ══════════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════════

function init() {
  const params = new URLSearchParams(window.location.search);
  const person = (params.get('person') || '').toLowerCase().trim();

  if (!person || !SURVEYS[person]) {
    state.phase = 'error';
    state.errorMsg = person
      ? `No survey found for "${person}". Check the URL.`
      : 'Missing survey. Add ?person=name to the URL (e.g. ?person=vicki).';
    render();
    return;
  }

  state.person = person;
  state.survey = SURVEYS[person];
  state.phase = 'intro';

  // Show demo banner if in demo mode
  if (CONFIG.DEMO_MODE) {
    document.getElementById('demoBanner').style.display = 'block';
    document.getElementById('demoInfoLink').addEventListener('click', (e) => {
      e.preventDefault();
      alert("Demo Mode: Responses are saved to localStorage on this device only. To send responses to the Google Sheet, a developer needs to deploy the Apps Script backend and set DEMO_MODE = false in the code.\n\nSheet ID: " + CONFIG.SHEET_ID);
    });
  }

  render();
}

// ══════════════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════════════

function render() {
  const main = document.getElementById('main');
  const progressWrap = document.getElementById('progressWrap');

  switch (state.phase) {
    case 'intro':
      progressWrap.style.display = 'none';
      main.innerHTML = renderIntro();
      break;

    case 'question':
      progressWrap.style.display = 'block';
      updateProgress();
      main.innerHTML = renderQuestion();
      attachQuestionHandlers();
      break;

    case 'submitting':
      progressWrap.style.display = 'none';
      main.innerHTML = renderSubmitting();
      break;

    case 'done':
      progressWrap.style.display = 'none';
      main.innerHTML = renderDone();
      break;

    case 'error':
      progressWrap.style.display = 'none';
      main.innerHTML = renderError();
      break;
  }
}

// ── Intro screen ──────────────────────────────────────────────────
function renderIntro() {
  const s = state.survey;
  const count = s.questions.length;
  return `
    <div class="question-card" style="text-align:center; padding:40px 28px;">
      <div style="font-size:40px; margin-bottom:16px;">👋</div>
      <h1 style="font-size:24px; font-weight:700; color:var(--forest); margin-bottom:14px;">
        Hi ${s.name}!
      </h1>
      <p style="font-size:16px; color:var(--muted); line-height:1.7; margin-bottom:28px;">
        ${s.intro}
      </p>
      <div style="font-size:13px; color:var(--muted); margin-bottom:28px;">
        ${count} questions · ~5 minutes
      </div>
      <button class="next-btn" id="startBtn" style="max-width:280px; margin:0 auto;">
        Let's go →
      </button>
    </div>
  `;
}

// ── Question screen ───────────────────────────────────────────────
function renderQuestion() {
  const q = state.survey.questions[state.currentIndex];
  const num = state.currentIndex + 1;
  const total = state.survey.questions.length;

  let inputHTML = '';

  if (q.type === 'multiple_choice') {
    inputHTML = `<div class="choices">
      ${q.choices.map(c => `
        <button class="choice-btn${state.answers[q.id] === c ? ' selected' : ''}"
          data-choice="${escHtml(c)}">${escHtml(c)}</button>
      `).join('')}
    </div>`;

  } else if (q.type === 'scale') {
    const selectedVal = state.answers[q.id];
    inputHTML = `
      <div class="scale-wrap">
        <div class="scale-btns">
          ${[1,2,3,4,5].map(n => `
            <button class="scale-btn${selectedVal == n ? ' selected' : ''}"
              data-scale="${n}">${n}</button>
          `).join('')}
        </div>
        ${q.labels ? `
          <div class="scale-labels">
            <span>${escHtml(q.labels[0])}</span>
            <span>${escHtml(q.labels[1])}</span>
          </div>
        ` : ''}
      </div>
    `;

  } else if (q.type === 'short_text') {
    inputHTML = `
      <input type="text" class="text-input" id="textInput"
        placeholder="Type your answer…"
        value="${escHtml(state.answers[q.id] || '')}"
        autocomplete="off" />
      <button class="next-btn" id="nextBtn" ${!state.answers[q.id] ? 'disabled' : ''}>
        Next →
      </button>
    `;

  } else if (q.type === 'long_text') {
    inputHTML = `
      <textarea class="textarea-input" id="textInput"
        placeholder="Type your answer…"
        rows="5">${escHtml(state.answers[q.id] || '')}</textarea>
      <button class="next-btn" id="nextBtn" ${!state.answers[q.id] ? 'disabled' : ''}>
        ${num === total ? 'Submit →' : 'Next →'}
      </button>
    `;
  }

  return `
    <div class="question-card">
      <div class="question-number">Question ${num} of ${total}</div>
      <div class="question-text">${escHtml(q.text)}</div>
      ${inputHTML}
    </div>
  `;
}

// ── Submitting screen ─────────────────────────────────────────────
function renderSubmitting() {
  return `
    <div class="loading-screen">
      <div class="spinner"></div>
      <p style="color:var(--muted); font-size:15px;">Saving your responses…</p>
    </div>
  `;
}

// ── Done screen ───────────────────────────────────────────────────
function renderDone() {
  const saved = CONFIG.DEMO_MODE ? 'saved to this device' : 'sent to the Teckton team';

  let demoPanel = '';
  if (CONFIG.DEMO_MODE) {
    const answers = state.answers;
    const questions = state.survey.questions;
    demoPanel = `
      <div class="demo-responses">
        <h3>Your Responses (Demo Mode)</h3>
        ${questions.map(q => `
          <div class="demo-response-item">
            <div class="demo-q">${escHtml(q.text)}</div>
            <div class="demo-a">${escHtml(answers[q.id] || '—')}</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  return `
    <div class="thank-you-screen">
      <div class="ty-icon">
        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 19l7 7L29 10" stroke="#96C95B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2 class="ty-title">Thank you, ${state.survey.name}!</h2>
      <p class="ty-body">
        Your answers have been ${saved}. Stan will review them personally.
      </p>
      <div class="ty-confirm">
        ✓ ${state.survey.questions.length} responses recorded
      </div>
    </div>
    ${demoPanel}
  `;
}

// ── Error screen ──────────────────────────────────────────────────
function renderError() {
  return `
    <div class="error-screen">
      <div class="error-icon">🔦</div>
      <div class="error-title">Survey not found</div>
      <div class="error-body">${escHtml(state.errorMsg || 'Something went wrong.')}</div>
      <div style="margin-top:20px; font-size:13px; color:var(--muted);">
        Available surveys:<br/>
        ${Object.keys(SURVEYS).map(k =>
          `<a href="?person=${k}" style="color:var(--accent); margin:0 4px;">${SURVEYS[k].name}</a>`
        ).join(' ')}
      </div>
    </div>
  `;
}

// ══════════════════════════════════════════════════════════════════
// PROGRESS BAR
// ══════════════════════════════════════════════════════════════════

function updateProgress() {
  const total = state.survey.questions.length;
  const current = state.currentIndex + 1;
  const pct = Math.round((current / total) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${current} of ${total}`;
}

// ══════════════════════════════════════════════════════════════════
// EVENT HANDLERS
// ══════════════════════════════════════════════════════════════════

document.getElementById('main').addEventListener('click', (e) => {
  // Start button
  if (e.target.id === 'startBtn') {
    state.currentIndex = 0;
    state.phase = 'question';
    render();
    return;
  }
});

function attachQuestionHandlers() {
  const q = state.survey.questions[state.currentIndex];
  const main = document.getElementById('main');

  // Multiple choice — tap to select + auto-advance
  main.querySelectorAll('.choice-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.dataset.choice;
      state.answers[q.id] = val;
      saveToLocalStorage();
      advance();
    });
  });

  // Scale — tap to select + auto-advance
  main.querySelectorAll('.scale-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.dataset.scale;
      state.answers[q.id] = val;
      saveToLocalStorage();
      advance();
    });
  });

  // Text input — enable Next when content present
  const textInput = main.querySelector('#textInput');
  if (textInput) {
    textInput.addEventListener('input', () => {
      const val = textInput.value.trim();
      state.answers[q.id] = val;
      const nextBtn = main.querySelector('#nextBtn');
      if (nextBtn) nextBtn.disabled = !val;
    });
  }

  // Next button (text types)
  const nextBtn = main.querySelector('#nextBtn');
  if (nextBtn) {
    nextBtn.addEventListener('click', () => {
      if (!state.answers[q.id]) return;
      saveToLocalStorage();
      advance();
    });
  }
}

// ══════════════════════════════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════════════════════════════

function advance() {
  const total = state.survey.questions.length;
  const next = state.currentIndex + 1;

  if (next >= total) {
    // Last question — submit
    submitSurvey();
  } else {
    state.currentIndex = next;
    render();
  }
}

// ══════════════════════════════════════════════════════════════════
// SUBMIT
// ══════════════════════════════════════════════════════════════════

async function submitSurvey() {
  state.phase = 'submitting';
  render();

  if (CONFIG.DEMO_MODE) {
    // Demo: just save to localStorage and show done
    await new Promise(r => setTimeout(r, 800));
    saveToLocalStorage();
    state.phase = 'done';
    render();
    return;
  }

  // Production: POST to Apps Script endpoint
  const payload = {
    person: state.person,
    name: state.survey.name,
    timestamp: new Date().toISOString(),
    answers: state.survey.questions.map(q => ({
      question: q.text,
      answer: state.answers[q.id] || '',
    })),
  };

  try {
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();

    if (data.ok) {
      clearLocalStorage();
      state.phase = 'done';
    } else {
      throw new Error(data.error || 'Server returned an error');
    }
  } catch (err) {
    // Fallback: save locally and still show done
    saveToLocalStorage();
    state.phase = 'done';
  }

  render();
}

// ══════════════════════════════════════════════════════════════════
// LOCAL STORAGE
// ══════════════════════════════════════════════════════════════════

function storageKey() {
  return `phargos_survey_${state.person}`;
}

function saveToLocalStorage() {
  try {
    localStorage.setItem(storageKey(), JSON.stringify({
      person: state.person,
      answers: state.answers,
      savedAt: new Date().toISOString(),
    }));
  } catch (e) {}
}

function clearLocalStorage() {
  try { localStorage.removeItem(storageKey()); } catch (e) {}
}

// ══════════════════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════════════════

function escHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// ══════════════════════════════════════════════════════════════════
// KICK OFF
// ══════════════════════════════════════════════════════════════════

init();
</script>
